<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f7">
<title>COME ON | NAVIGATION</title>
<style>
  :root { --ink:#171717; --muted:#777; --line:#e5e5e5; --tile:#f0f0f0; --paper:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f7f7f7; color:var(--ink); font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { width:min(100% - 28px, 720px); margin:24px auto; }
  .panel { background:var(--paper); border:1px solid var(--line); border-radius:25px; padding:18px; box-shadow:0 8px 28px rgba(0,0,0,.035); }
  .block { background:var(--tile); border-radius:18px; padding:24px 16px; text-align:center; }
  .eyebrow { font-size:clamp(12px, 3.2vw, 16px); font-weight:750; letter-spacing:.015em; line-height:1.45; }
  h1 { margin:0; font-size:clamp(21px, 5vw, 30px); line-height:1.25; font-weight:800; }
  .sub { margin:8px 0 0; color:var(--muted); font-size:clamp(13px, 3.5vw, 17px); line-height:1.4; }
  .arrow { text-align:center; font-size:27px; line-height:1; margin:16px 0; font-weight:400; }
  .buttons { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .btn { display:flex; min-height:102px; padding:15px 8px; flex-direction:column; justify-content:center; align-items:center; gap:9px; text-decoration:none; color:inherit; background:#fff; border:1.5px solid var(--line); border-radius:20px; font-size:clamp(16px, 4vw, 21px); font-weight:650; text-align:center; transition:transform .15s ease, background .15s ease, border-color .15s ease; }
  .btn:active { transform:scale(.985); background:#f5f5f5; }
  .out { font-size:21px; line-height:1; font-weight:500; }
  .foot { text-align:center; margin:16px 0 0; color:#999; font-size:12px; }
  @media (min-width:600px) { .wrap{margin:48px auto}.panel{padding:20px}.btn{min-height:112px} }
</style>
</head>
<body>
<main class="wrap">
  <section class="panel" aria-label="Навигация">
    <div class="block">
      <div class="eyebrow">TikTok · Instagram · Threads · реклама</div>
      <p class="sub">Весь привлечённый трафик</p>
    </div>
    <div class="arrow" aria-hidden="true">↓</div>
    <div class="block">
      <h1>COME ON | NAVIGATION</h1>
      <p class="sub">Единая ссылка для подписки и выбора направления</p>
    </div>
    <div class="arrow" aria-hidden="true">↓</div>
    <nav class="buttons" aria-label="Разделы">
      <!-- Замени # на свои ссылки. Например: https://t.me/username -->
      <a class="btn" href="#" onclick="return openNotice(event, 'Аукцион')"><span class="out">↗</span><span>Аукцион</span></a>
      <a class="btn" href="#" onclick="return openNotice(event, 'Скупка')"><span class="out">↗</span><span>Скупка</span></a>
      <a class="btn" href="#" onclick="return openNotice(event, 'Каталог')"><span class="out">↗</span><span>Каталог</span></a>
      <a class="btn" href="#" onclick="return openNotice(event, 'Администратор')"><span class="out">↗</span><span>Администратор</span></a>
    </nav>
    <p class="foot">COME ON · NAVIGATION</p>
  </section>
</main>
<script>
function openNotice(event, name) {
  const link = event.currentTarget;
  if (link.getAttribute('href') === '#') {
    event.preventDefault();
    alert('Чтобы подключить раздел «' + name + '», открой index.html в редакторе и замени href="#" на свою ссылку.');
    return false;
  }
  return true;
}
</script>
</body>
</html>
